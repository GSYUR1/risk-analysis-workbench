registry_type: metric_registry
version: 1
updated_at: '2026-08-28'

notes:
  base_tables:
    - table: ph_risk.cx_ph_newcust_cre_indicator
      role: pivot底表（指标聚合，粒度 user_id*credit_apply_no*loan_apply_no，trace_date>='2025-05-01'）
    - table: ph_risk.cx_ph_newcust_cre_order_trace
      role: 用户实际取数明细表（同粒度，含全部维度与明细字段）
  currency: 底表金额单位为PHP；pivot中($)列按 FX=61 PHP/USD 换算（已用rawdata数值反推验证）。菲律宾_常用数仓表.xlsx 中旧口径SQL使用/56。
  risk_semantics: |
    风险表现点记作 {期数}_{观察天数}，源自 ph_dws.dws_risk_dpd_vintage_df（tag='new'）。
    overdue_amt_{p}_{d}: 第p期在观察点d天的逾期金额（源表字段）。
    观察点已出数(overdue_amt非null)即视为到期: expire_amt_{p}_{d}=该单repay_principal, expire_cnt_{p}_{d}=1。
    overdue_cnt_{p}_{d}=1 当 overdue_amt_{p}_{d}>0。
    金额逾期率 dpd{p}_{d}=overdue_amt/expire_amt；人头(订单)逾期率 dpd{p}_{d}cnt=overdue_cnt/expire_cnt。
  risk_points: 期数1观察点[1,2,3,4,5,7,10,15]；期数2观察点[1,2,3,4,5,7,10,15]；期数3-6观察点[1,3,7,15]，共32个表现点。

profiles:
  ph_newcust_cre_pivot_v1:
    name: 菲律宾新客常用指标口径
    description: 基于 菲律宾新客常用指标.xlsx pivot参考 逐列数值反推验证后的指标注册表，并扩展全部32个风险表现点与衍生指标（人头逾期率、授信效率）。
    metrics:
      cre_cnt:
        name: 授信件数
        category: credit
        format: integer
        aggregation: sum
        numerator_field: cre_cnt
        denominator_field: null
        definition: 授信申请件数 = count(distinct credit_apply_no)。pivot列：授信件数。
        source: excel_pivot_formula_confirmed
        sql_expression: count(distinct credit_apply_no)
      apprv_cnt:
        name: 授信通过件数
        category: credit
        format: integer
        aggregation: sum
        numerator_field: apprv_cnt
        denominator_field: null
        definition: 授信通过件数 = count(distinct case when is_approve=1 then credit_apply_no end)，is_approve=1 即 status=20。
        source: sql_metric_source
        sql_expression: count(distinct case when is_approve=1 then credit_apply_no end)
      credit_pass_rate:
        name: 授信通过率
        category: credit
        format: percent
        aggregation: ratio
        numerator_field: apprv_cnt
        denominator_field: cre_cnt
        formula: apprv_cnt/cre_cnt
        definition: '授信通过率 = 授信通过件数/授信件数。pivot列：求和项:授信通过率。'
        source: excel_pivot_formula_confirmed
      total_credits:
        name: 授信通过总额度(PHP)
        category: credit
        format: amount
        aggregation: sum
        numerator_field: total_credits
        denominator_field: null
        definition: 授信通过总额度 = sum(case when is_approve=1 and is_credit=1 then credit_amount_after end)，单位PHP。
        source: sql_metric_source
        sql_expression: sum(case when is_approve=1 and is_credit=1 then credit_amount_after end)
      credit_amount_avg_php:
        name: 授信件均(PHP)
        category: credit
        format: integer
        aggregation: ratio
        numerator_field: total_credits
        denominator_field: apprv_cnt
        formula: total_credits/apprv_cnt
        definition: 授信件均（PHP）= 授信通过总额度/授信通过件数。
        source: sql_metric_source
      credit_amount_usd:
        name: 授信额度($)
        category: credit
        format: decimal
        aggregation: ratio
        numerator_field: total_credits
        denominator_field: apprv_cnt
        formula: total_credits/apprv_cnt/61
        definition: '人均授信额度（USD）= 授信通过总额度/授信通过件数/61。pivot列：求和项:授信额度($)。'
        source: excel_pivot_formula_confirmed
        sql_expression: sum(total_credits)/sum(apprv_cnt)/61
      credit_efficiency:
        name: 授信效率
        category: credit
        format: decimal
        aggregation: ratio
        numerator_field: total_credits
        denominator_field: cre_cnt
        formula: total_credits/cre_cnt
        definition: '授信效率 = 总授信额度/授信件数（用户指定口径，PHP）。参考：菲律宾_常用数仓表.xlsx 中定义 授信效率=人均授信USD*授信通过率。'
        source: user_specified_derived
      t0_order_fz:
        name: 动支T0(当天)人数(分子)
        category: credit_to_withdraw
        format: integer
        aggregation: sum
        numerator_field: t0_order_fz
        denominator_field: null
        definition: 授信通过后T0(当天)内发起动支的人数分子 = sum(case when is_approve=1 then t0_order end)；t0_order=订单创建时间距授信创建时间<=阈值。
        source: excel_pivot_formula_confirmed
        sql_expression: sum(case when is_approve=1 then t0_order end)
      withdraw_rate_t0:
        name: 动支率T0(当天)
        category: credit_to_withdraw
        format: percent
        aggregation: ratio
        numerator_field: t0_order_fz
        denominator_field: apprv_cnt
        formula: t0_order_fz/apprv_cnt
        definition: '动支率T0(当天) = T0(当天)内动支人数/授信通过件数。pivot列：求和项:动支率T0(当天)。'
        source: excel_pivot_formula_confirmed
      t1_order_fz:
        name: 动支T1(24h)人数(分子)
        category: credit_to_withdraw
        format: integer
        aggregation: sum
        numerator_field: t1_order_fz
        denominator_field: null
        definition: 授信通过后T1(24h)内发起动支的人数分子 = sum(case when is_approve=1 then t1_order end)；t1_order=订单创建时间距授信创建时间<=阈值。
        source: sql_metric_source
        sql_expression: sum(case when is_approve=1 then t1_order end)
      withdraw_rate_t1:
        name: 动支率T1(24h)
        category: credit_to_withdraw
        format: percent
        aggregation: ratio
        numerator_field: t1_order_fz
        denominator_field: apprv_cnt
        formula: t1_order_fz/apprv_cnt
        definition: 动支率T1(24h) = T1(24h)内动支人数/授信通过件数。pivot未展示，按同口径衍生。
        source: sql_metric_source
      t3_order_fz:
        name: 动支T3(72h)人数(分子)
        category: credit_to_withdraw
        format: integer
        aggregation: sum
        numerator_field: t3_order_fz
        denominator_field: null
        definition: 授信通过后T3(72h)内发起动支的人数分子 = sum(case when is_approve=1 then t3_order end)；t3_order=订单创建时间距授信创建时间<=阈值。
        source: excel_pivot_formula_confirmed
        sql_expression: sum(case when is_approve=1 then t3_order end)
      withdraw_rate_t3:
        name: 动支率T3(72h)
        category: credit_to_withdraw
        format: percent
        aggregation: ratio
        numerator_field: t3_order_fz
        denominator_field: apprv_cnt
        formula: t3_order_fz/apprv_cnt
        definition: '动支率T3(72h) = T3(72h)内动支人数/授信通过件数。pivot列：求和项:动支率T3(72h)。'
        source: excel_pivot_formula_confirmed
      t7_order_fz:
        name: 动支T7(168h)人数(分子)
        category: credit_to_withdraw
        format: integer
        aggregation: sum
        numerator_field: t7_order_fz
        denominator_field: null
        definition: 授信通过后T7(168h)内发起动支的人数分子 = sum(case when is_approve=1 then t7_order end)；t7_order=订单创建时间距授信创建时间<=阈值。
        source: sql_metric_source
        sql_expression: sum(case when is_approve=1 then t7_order end)
      withdraw_rate_t7:
        name: 动支率T7(168h)
        category: credit_to_withdraw
        format: percent
        aggregation: ratio
        numerator_field: t7_order_fz
        denominator_field: apprv_cnt
        formula: t7_order_fz/apprv_cnt
        definition: 动支率T7(168h) = T7(168h)内动支人数/授信通过件数。pivot未展示，按同口径衍生。
        source: sql_metric_source
      is_order_fz:
        name: 动支件数
        category: credit_to_withdraw
        format: integer
        aggregation: sum
        numerator_field: is_order_fz
        denominator_field: null
        definition: 动支件数 = sum(case when is_approve=1 then is_order end)，授信通过后发起过动支订单。pivot列：动支件数。
        source: excel_pivot_formula_confirmed
        sql_expression: sum(case when is_approve=1 then is_order end)
      withdraw_rate:
        name: 动支率
        category: credit_to_withdraw
        format: percent
        aggregation: ratio
        numerator_field: is_order_fz
        denominator_field: apprv_cnt
        formula: is_order_fz/apprv_cnt
        definition: '总动支率 = 动支件数/授信通过件数。pivot列：求和项:动支率。'
        source: excel_pivot_formula_confirmed
      order_approve_cnt:
        name: 动支通过件数
        category: withdraw
        format: integer
        aggregation: sum
        numerator_field: order_approve_cnt
        denominator_field: null
        definition: '动支审核通过件数 = sum(case when is_approve=1 then is_order_approve end)，订单status>=30。'
        source: sql_metric_source
        sql_expression: sum(case when is_approve=1 then is_order_approve end)
      order_pending_cnt:
        name: 动支审核中件数
        category: withdraw
        format: integer
        aggregation: sum
        numerator_field: order_pending_cnt
        denominator_field: null
        definition: 动支pending件数 = sum(case when is_approve=1 then is_order_pending end)，订单status=10。
        source: sql_metric_source
        sql_expression: sum(case when is_approve=1 then is_order_pending end)
      withdraw_pass_rate:
        name: 动支通过率
        category: withdraw
        format: percent
        aggregation: ratio
        numerator_field: order_approve_cnt
        denominator_field: is_order_fz
        formula: order_approve_cnt/is_order_fz
        definition: '动支通过率 = 动支通过件数/动支件数。pivot列：求和项:动支通过率。'
        source: excel_pivot_formula_confirmed
      withdraw_pending_rate:
        name: 动支pending率
        category: withdraw
        format: percent
        aggregation: ratio
        numerator_field: order_pending_cnt
        denominator_field: is_order_fz
        formula: order_pending_cnt/is_order_fz
        definition: 动支审核中占比 = 动支审核中件数/动支件数。
        source: sql_metric_source
      order_apprv_credits:
        name: 动支通过授信额度(PHP)
        category: withdraw
        format: amount
        aggregation: sum
        numerator_field: order_apprv_credits
        denominator_field: null
        definition: 动支通过人的授信额度合计 = sum(case when is_approve=1 then order_apprv_credits end)。
        source: sql_metric_source
        sql_expression: sum(case when is_approve=1 then order_apprv_credits end)
      order_apprv_principal:
        name: 动支通过金额(PHP)
        category: withdraw
        format: amount
        aggregation: sum
        numerator_field: order_apprv_principal
        denominator_field: null
        definition: '动支通过金额合计 = sum(case when is_approve=1 then order_apprv_principal end)，订单status>=30的loan_principal。'
        source: sql_metric_source
        sql_expression: sum(case when is_approve=1 then order_apprv_principal end)
      payout_cnt:
        name: 成交件数
        category: withdraw
        format: integer
        aggregation: sum
        numerator_field: payout_cnt
        denominator_field: null
        definition: 成交（放款成功）件数 = sum(case when is_approve=1 then is_payout end)，订单status=50。pivot列：成交件数。
        source: excel_pivot_formula_confirmed
        sql_expression: sum(case when is_approve=1 then is_payout end)
      payout_credits:
        name: 成交授信额度合计(PHP)
        category: withdraw
        format: amount
        aggregation: sum
        numerator_field: payout_credits
        denominator_field: null
        definition: 成交人的授信额度合计 = sum(case when is_approve=1 then payout_credits end)。
        source: sql_metric_source
        sql_expression: sum(case when is_approve=1 then payout_credits end)
      payout_principal:
        name: 成交金额(PHP)
        category: withdraw
        format: amount
        aggregation: sum
        numerator_field: payout_principal
        denominator_field: null
        definition: 成交（放款成功）金额合计 = sum(case when is_approve=1 then payout_principal end)，单位PHP。pivot列：成交金额。
        source: excel_pivot_formula_confirmed
        sql_expression: sum(case when is_approve=1 then payout_principal end)
      payout_prin_t0:
        name: 成交金额T0(PHP)
        category: withdraw
        format: amount
        aggregation: sum
        numerator_field: payout_prin_t0
        denominator_field: null
        definition: 授信后t0窗口内成交的放款金额 = sum(case when is_approve=1 then payout_prin_t0 end)。
        source: sql_metric_source
        sql_expression: sum(case when is_approve=1 then payout_prin_t0 end)
      payout_prin_t1:
        name: 成交金额T1(PHP)
        category: withdraw
        format: amount
        aggregation: sum
        numerator_field: payout_prin_t1
        denominator_field: null
        definition: 授信后t1窗口内成交的放款金额 = sum(case when is_approve=1 then payout_prin_t1 end)。
        source: sql_metric_source
        sql_expression: sum(case when is_approve=1 then payout_prin_t1 end)
      payout_prin_t3:
        name: 成交金额T3(PHP)
        category: withdraw
        format: amount
        aggregation: sum
        numerator_field: payout_prin_t3
        denominator_field: null
        definition: 授信后t3窗口内成交的放款金额 = sum(case when is_approve=1 then payout_prin_t3 end)。
        source: sql_metric_source
        sql_expression: sum(case when is_approve=1 then payout_prin_t3 end)
      deal_credit_per_case_usd:
        name: 成交-授信件均($)
        category: withdraw
        format: decimal
        aggregation: ratio
        numerator_field: payout_credits
        denominator_field: payout_cnt
        formula: payout_credits/payout_cnt/61
        definition: '成交-授信件均（USD）= 成交授信额度合计/成交件数/61。pivot列：求和项:成交-授信件均($)。'
        source: excel_pivot_formula_confirmed
        sql_expression: sum(payout_credits)/sum(payout_cnt)/61
      loan_principal_per_case_usd:
        name: 放款件均($)
        category: withdraw
        format: decimal
        aggregation: ratio
        numerator_field: payout_principal
        denominator_field: payout_cnt
        formula: payout_principal/payout_cnt/61
        definition: '放款件均（USD）= 成交金额/成交件数/61。pivot列：求和项:放款件均($)。'
        source: excel_pivot_formula_confirmed
        sql_expression: sum(payout_principal)/sum(payout_cnt)/61
      deal_amt_dt:
        name: '放款本金*实际天数合计'
        category: pricing
        format: amount
        aggregation: sum
        numerator_field: deal_amt_dt
        denominator_field: null
        definition: 'deal_amt_dt = Σ(DATEDIFF(due_date,account_date)*repay_principal)，原版口径中作为IRR分母/久期分子（按还款计划）。'
        source: sql_metric_source
        sql_expression: sum(deal_amt_dt)
      sum_real_duration_principal:
        name: 久期分子(实际)
        category: pricing
        format: amount
        aggregation: sum
        numerator_field: sum_real_duration_principal
        denominator_field: null
        definition: 'sum(repay_principal*real_duration)，real_duration来自产品映射表a_duration。'
        source: sql_metric_source
        sql_expression: 'sum(repay_principal*real_duration)'
      dt_amt_sum_apr:
        name: APR分母(名义)
        category: pricing
        format: amount
        aggregation: sum
        numerator_field: dt_amt_sum_apr
        denominator_field: null
        definition: 'sum(repay_principal*apr_duration)，apr_duration来自产品映射表n_duration。'
        source: sql_metric_source
        sql_expression: 'sum(repay_principal*apr_duration)'
      sum_irr_principal:
        name: IRR分子
        category: pricing
        format: amount
        aggregation: sum
        numerator_field: sum_irr_principal
        denominator_field: null
        definition: 'SUM(repay_principal*price*real_duration)。'
        source: sql_metric_source
        sql_expression: 'SUM(repay_principal*price*real_duration)'
      repay_principal:
        name: 应还本金合计
        category: pricing
        format: amount
        aggregation: sum
        numerator_field: repay_principal
        denominator_field: null
        definition: 还款计划应还本金合计。
        source: sql_metric_source
        sql_expression: sum(repay_principal)
      repay_interest:
        name: 应还利息合计
        category: pricing
        format: amount
        aggregation: sum
        numerator_field: repay_interest
        denominator_field: null
        definition: 还款计划应还利息合计。
        source: sql_metric_source
        sql_expression: sum(repay_interest)
      repay_principal_add_interest:
        name: 应还本息合计
        category: pricing
        format: amount
        aggregation: sum
        numerator_field: repay_principal_add_interest
        denominator_field: null
        definition: 还款计划应还本金+利息合计。
        source: sql_metric_source
        sql_expression: sum(repay_principal_add_interest)
      real_duration:
        name: 久期
        category: pricing
        format: decimal
        aggregation: ratio
        numerator_field: sum_real_duration_principal
        denominator_field: repay_principal
        formula: sum_real_duration_principal/repay_principal
        definition: '久期（实际）= Σ(repay_principal*实际久期)/Σ(repay_principal)。pivot列：求和项:久期。'
        source: excel_pivot_formula_confirmed
      apr_duration:
        name: 名义期限
        category: pricing
        format: decimal
        aggregation: ratio
        numerator_field: dt_amt_sum_apr
        denominator_field: repay_principal
        formula: dt_amt_sum_apr/repay_principal
        definition: '名义期限 = Σ(repay_principal*名义久期)/Σ(repay_principal)。pivot列：求和项:名义期限。'
        source: excel_pivot_formula_confirmed
      irr:
        name: IRR
        category: pricing
        format: percent
        aggregation: ratio
        numerator_field: sum_irr_principal
        denominator_field: sum_real_duration_principal
        formula: sum_irr_principal/sum_real_duration_principal
        definition: 'IRR = Σ(repay_principal*price*实际久期)/Σ(repay_principal*实际久期)（原版口径分母为deal_amt_dt）。pivot列：求和项:IRR。'
        source: excel_pivot_formula_confirmed
      apr:
        name: APR
        category: pricing
        format: percent
        aggregation: ratio
        numerator_field: repay_interest
        denominator_field: dt_amt_sum_apr
        formula: repay_interest/dt_amt_sum_apr
        definition: 'APR = 应还利息/Σ(repay_principal*名义久期)。pivot列：求和项:APR。'
        source: excel_pivot_formula_confirmed
      available_amount_before:
        name: 动支前可用额度合计
        category: quota
        format: amount
        aggregation: sum
        numerator_field: available_amount_before
        denominator_field: null
        definition: sum(available_amount_before)，额度切片表biz_scene=20。
        source: sql_metric_source
        sql_expression: sum(available_amount_before)
      available_amount_after:
        name: 动支后可用额度合计
        category: quota
        format: amount
        aggregation: sum
        numerator_field: available_amount_after
        denominator_field: null
        definition: sum(available_amount_after)。
        source: sql_metric_source
        sql_expression: sum(available_amount_after)
      overdue_amt_1_1:
        name: 逾期金额1_1
        category: risk_overdue_amt
        format: amount
        aggregation: sum
        numerator_field: overdue_amt_1_1
        denominator_field: null
        definition: 第1期观察点1天的逾期金额合计 = SUM(dpd1_1)，源字段 dws_risk_dpd_vintage_df.overdue_amt_1_1。
        source: sql_metric_source
        sql_expression: SUM(dpd1_1)
      expire_amt_1_1:
        name: 到期金额1_1
        category: risk_expire_amt
        format: amount
        aggregation: sum
        numerator_field: expire_amt_1_1
        denominator_field: null
        definition: 第1期观察点1天的到期本金合计 = SUM(expire_amt_1_1)，到期判定：overdue_amt_1_1非null，值为该单repay_principal。
        source: sql_metric_source
        sql_expression: SUM(expire_amt_1_1)
      overdue_cnt_1_1:
        name: 逾期件数1_1
        category: risk_overdue_cnt
        format: integer
        aggregation: sum
        numerator_field: overdue_cnt_1_1
        denominator_field: null
        definition: '第1期观察点1天逾期的订单数 = SUM(overdue_cnt_1_1)，overdue_cnt=1当overdue_amt_1_1>0。'
        source: sql_metric_source
        sql_expression: SUM(overdue_cnt_1_1)
      expire_cnt_1_1:
        name: 到期件数1_1
        category: risk_expire_cnt
        format: integer
        aggregation: sum
        numerator_field: expire_cnt_1_1
        denominator_field: null
        definition: 第1期观察点1天到期的订单数 = SUM(expire_cnt_1_1)，到期判定：overdue_amt_1_1非null。
        source: sql_metric_source
        sql_expression: SUM(expire_cnt_1_1)
      dpd1_1:
        name: 1_1金额逾期率
        category: risk_rate_amt
        format: percent
        aggregation: ratio
